# Builds the GitHub Pages site as:
#   /                     → repo root index.html (Privacy Policy)
#   /email-confirmation/  → web/email-confirmation/index.html (Supabase redirect landing)
#
# Setup (once):
# 1. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 2. If another Pages workflow exists (e.g. Jekyll), disable it so only this one deploys.
# 3. Actions → "Deploy GitHub Pages" → Run workflow (workflow_dispatch), or push to main.
#
# Supabase Redirect URL (example):
#   https://YOUR_USER.github.io/YOUR_REPO/email-confirmation/
#
# App env:
#   EXPO_PUBLIC_AUTH_REDIRECT_URL=<that same URL>

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/email-confirmation/**"
      - "index.html"
      - ".github/workflows/deploy-email-confirmation-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/email-confirmation
          cp index.html _site/index.html
          cp web/email-confirmation/index.html _site/email-confirmation/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
